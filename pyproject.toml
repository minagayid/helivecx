[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helivecx"
version = "1.0.0"
description = "Helix Vector Encoding & Compression – DNA-inspired high-dimensional vector compression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["compression", "vector", "dna", "helix", "encoding", "high-dimensional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Keep runtime deps minimal
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
]

[project.scripts]
helivecx = "helivecx.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["helivecx*"]
